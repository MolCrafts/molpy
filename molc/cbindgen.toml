language = "C"
include_guard = "MOLC_H"
autogen_warning = "/* Warning: this file is autogenerated by cbindgen. Do not modify. */"
tab_width = 4
style = "both"
cpp_compat = true
documentation = false
# `F` is `molrs::op::F` (always f64); cbindgen does not parse
# dependencies, so the header states it here.
after_includes = "typedef double F;"

# (No [defines]: widths are fixed and F is double unconditionally, so there is
# no cargo feature for cbindgen to map onto a C macro.)

[export]
prefix = ""
exclude = ["HandleRegistry", "BoxKey", "ForceFieldKey", "RegionKey"]

[export.rename]

[enum]
rename_variants = "QualifiedScreamingSnakeCase"

[fn]
rename_args = "None"

[parse]
parse_deps = false
