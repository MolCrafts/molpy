[package]
name = "molcrafts-molc"
version = "0.19.0"
edition = "2024"
authors = ["MolCrafts"]
license = "BSD-3-Clause"
description = "C API for molrs, enabling C/C++ integration"
repository = "https://github.com/MolCrafts/molrs"
homepage = "https://github.com/MolCrafts/molrs"

[lib]
name = "molc"
crate-type = ["cdylib", "staticlib", "lib"]

[workspace]

# Standalone workspace root: does NOT inherit the repo root's [profile.release].
# Keep the four keys identical to ../Cargo.toml so every root ships the same
# optimisation.
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"

[features]
default = []

[dependencies]
# molrs defaults to core only, so the set is spelled here: `full` +
# `filesystem` + `rayon` (molrs-ffi's default) + `serde`, whose force-field
# section impls are `molrs_forcefield_to_json` / `molrs_forcefield_from_json` — build 2 in
# .cargo/config.toml, shared with molcxx. Never `stream`: no tokio /
# tungstenite in a C archive.
molrs = { path = "../crates/molrs", package = "molcrafts-molrs", version = "0.19.0", default-features = false, features = ["full", "filesystem", "rayon", "serde"] }
molrs-ffi = { path = "../crates/molrs-ffi", package = "molcrafts-molrs-ffi", version = "0.19.0" }
slotmap = "1.0"
ndarray = "0.17"
# The element type of molrs's `c64` / `c128` columns (`Complex<f32>` /
# `Complex<f64>`), which `molrs_block_set` / `molrs_block_get` name.
num-complex = "0.4"
serde_json = "1"

[build-dependencies]
cbindgen = "0.29"

# Standalone workspace root: does NOT inherit the repo root's [profile.dev].
# Keep these two keys identical to ../Cargo.toml -- they are what keeps the
# shared target/ small enough to stay fast on Lustre (see ../Cargo.toml for the
# measurement).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
