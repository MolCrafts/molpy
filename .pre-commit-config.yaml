# prek: pre-commit = lint; pre-push = molrs pin + tests
# CI: lint job + 3 OS × 3.12–3.14 matrix (ci.yml).
# Tests MUST use `uv run pytest`, not tox: tox's pip ignores [tool.uv.sources].

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: check-toml
      - id: check-json

  - repo: local
    hooks:
      - id: tox-lint
        name: tox -e lint
        entry: uv run --no-project --with 'tox>=4.23' --with ruff==0.16.1 --with ty==0.0.65 tox -e lint
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: molrs-pin-on-pypi
        name: molrs pin on PyPI
        entry: python3 .pre-commit/check_molrs_pin_on_pypi.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # Same command as ci.yml `test` — uv honors [tool.uv.sources], tox/pip does not.
      - id: pytest
        name: uv pytest (CI parity)
        entry: uv run --extra dev python -m pytest tests/ -n auto
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
