# Managed by prek: `prek install`
# Mirrors .github/workflows/ci.yml via tox (no scripts/ gate wrappers).
#   commit / pre-push lint — tox -e lint
#   pre-push test          — tox -e py  (non-editable wheel)

default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: check-toml
      - id: check-json

  - repo: local
    hooks:
      - id: tox-lint
        name: "CI lint (tox -e lint: ruff + ty)"
        # tox from optional-dependencies `dev`
        entry: uv run --extra dev tox -e lint
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: tox-py
        name: "CI test (tox -e py: non-editable + pytest)"
        entry: uv run --extra dev tox -e py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
