# prek: pre-commit = lint; pre-push = molrs pin + tests
# CI: lint job + 3 OS × 3.12–3.14 matrix (ci.yml)

default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: check-toml
      - id: check-json

  - repo: local
    hooks:
      - id: tox-lint
        name: tox -e lint
        entry: uv run --extra dev tox -e lint
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: molrs-pin-on-pypi
        name: molrs pin on PyPI
        entry: python3 .pre-commit/check_molrs_pin_on_pypi.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: tox-py
        name: tox -e py
        entry: uv run --extra dev tox -e py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
