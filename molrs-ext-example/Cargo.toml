[package]
name = "molrs-ext-example"
publish = false
# Literal, not `.workspace = true`: a standalone workspace root (see
# [workspace] below) inherits nothing. Keep in step with ../Cargo.toml.
version = "0.18.0"
edition = "2024"
rust-version = "1.91"
authors = ["MolCrafts"]
license = "BSD-3-Clause"
description = "A third party extending the molrs force-field IR through its public API: a pair style, a new category, an expression style"
repository = "https://github.com/MolCrafts/molrs"
homepage = "https://github.com/MolCrafts/molrs"

# Standalone workspace root, like the binder crates: this crate depends on
# molrs exactly as an outside user's crate does, so nothing in it can reach
# past the `pub` API. Build and test it with
# `--manifest-path molrs-ext-example/Cargo.toml` (`scripts/check.sh ext`).
[workspace]

[dependencies]
# The feature set of the root workspace's `cargo mrs-*` builds (build 1 in
# ../.cargo/config.toml, with molrs's default `rayon`): the same molrs
# library unit, compiled once.
molrs = { path = "../molrs", package = "molcrafts-molrs", version = "0.18.0", features = ["full", "filesystem", "stream"] }
ndarray = "0.17"

# Standalone workspace root: does NOT inherit the repo root's profiles. Keep
# these identical to ../Cargo.toml.
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
