[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "molcrafts-molrs"
version = "0.18.0"
description = "Python bindings for molrs molecular simulation library"
requires-python = ">=3.12"
readme = "README.md"
license = "BSD-3-Clause"
dependencies = ["numpy>=2.0"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
# Gate tools: scripts/check.sh python builds and installs one non-editable
# wheel into this locked environment; it never installs the project twice.
# Editable: `uv sync --extra dev` or `pip install -e ".[dev]"`.
dev = [
    "maturin>=1.0,<2.0",
    "pytest",
    "pytest-cov",
    "numpy>=2.0",
]
# Everything `zensical build` needs for the docs site: zensical itself (pulls
# its own deps) plus the mkdocstrings python handler used by zensical.toml's
# `[project.plugins.mkdocstrings]`. Build the site with: pip install ".[doc]"
doc = [
    "zensical>=0.0.51",
    "mkdocstrings[python]",
    # Shared MolCrafts brand theme (zensical.toml sets `theme.name = "molcrafts"`),
    # matching molpy / molcfg / mollog so `pip install .[doc]` builds standalone.
    "molcrafts-zensical-theme>=0.2.3",
]

[tool.maturin]
python-source = "python"
module-name = "molrs._native"
features = ["pyo3/extension-module"]
exclude = [
  "python/molrs/*.so",
  "python/molrs/*.dylib",
  "python/molrs/*.dll",
  "python/molrs/*.dSYM",
  "python/molrs/*.dSYM/**",
]

# uv caches a molrs it built from a checkout by these keys. Its default, this
# file alone, would keep handing a wheel built from an older commit to the
# projects that build molrs from a checkout of its dev (molrec, molpack,
# molpy); with the commit as a key, a checkout that moves is rebuilt.
# Uncommitted Rust edits still need `--reinstall-package molcrafts-molrs`.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { git = { commit = true } }]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `python -X warn_default_encoding -m pytest` (how the suite is run) makes
# every text-mode open without encoding= warn, and this makes the warning an
# error: Python would decode with the locale, cp1252 on Windows, so such a
# read passes on Linux and fails only on Windows. Ruff's PLW1514 catches it
# statically only where it can tell the receiver is a Path.
filterwarnings = ["error::EncodingWarning"]
