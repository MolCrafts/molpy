[package]
name = "molrs-python"
version = "0.18.0"
edition = "2024"
rust-version = "1.91"
authors = ["MolCrafts"]
license = "BSD-3-Clause"
description = "Python bindings for molrs molecular simulation library"
repository = "https://github.com/MolCrafts/molrs"
homepage = "https://github.com/MolCrafts/molrs"

[lib]
name = "molrs_python"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = [
    "extension-module",
    "abi3-py312",
    "multiple-pymethods",
] }
numpy = { version = "0.28", features = ["half"] }
half = { version = "2", default-features = false, features = ["num-traits", "std"] }
num-complex = "0.4"
ndarray = "0.17"
serde_json = "1"
# `ff` exposes `molrs_ffi::ForceFieldRef`, the stable handle behind
# `ForceField._ffi_forcefield_capsule()` (the force-field analogue of the frame
# capsule). `default-features = false` is the same Pyodide exemption as the
# molrs dep below: a transitive default cannot be switched off from here.
molrs-ffi = { path = "../molrs-ffi", package = "molcrafts-molrs-ffi", version = "0.18.0", default-features = false, features = ["ff"] }
# Base: full (no zarr). Host zarr + path I/O is optional (`fs` feature) so
# Pyodide builds can omit zarrs/libz-sys (emscripten cannot link host zlib).
#
# `stream` is unconditional here: molrs declares tokio /
# tungstenite under `cfg(not(target_arch = "wasm32"))` and gates
# `molrs::stream::publisher` the same way, so a Pyodide (wasm32-emscripten) build
# compiles only the WASM-clean `ControlCommand` wire types and links no
# networking stack, while retaining the MessagePack/JSON Frame codec.
#
# `default-features = false` here is a DELIBERATE Pyodide exemption: emscripten
# cannot link host zlib or a thread pool, so the minimal `full + stream` base
# must remain reachable via `maturin … --no-default-features`; `fs` and `rayon`
# below add the native pieces back.
molrs = { path = "../molrs", package = "molcrafts-molrs", version = "0.18.0", default-features = false, features = ["full", "stream"] }

[features]
default = ["fs", "rayon"]
# Desktop/native: path-based zarr trajectory I/O (`molrs/filesystem` → zarr).
# Off for Pyodide: `maturin … --no-default-features`.
fs = ["molrs/filesystem"]
# Desktop/native parallelism. Pyodide's `--no-default-features` drops it
# together with `fs`.
rayon = ["molrs/rayon"]

[workspace]

# Standalone workspace root: does NOT inherit the repo root's [profile.release].
# Keep the four keys identical to ../Cargo.toml so every root ships the same
# optimisation.
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"

# Standalone workspace root: does NOT inherit the repo root's [profile.dev].
# Keep these two keys identical to ../Cargo.toml -- they are what keeps the
# shared target/ small enough to stay fast on Lustre (see ../Cargo.toml for the
# measurement).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
