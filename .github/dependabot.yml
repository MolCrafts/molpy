# The lock files are committed so a local gate and CI resolve the same
# dependency versions. Dependabot keeps them current: one grouped PR per
# ecosystem per week, gated by the same CI as any other change.
version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/crates/molrs-ffi"
      - "/molrs-python"
      - "/molwasm"
      - "/molc"
      - "/molcxx"
    schedule:
      interval: weekly
    target-branch: dev
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: "/molrs-python"
    schedule:
      interval: weekly
    target-branch: dev
    # maturin is the build backend ([build-system] requires, a range) as
    # well as a dev tool; Dependabot's uv updater cannot move it and every
    # attempt fails with "No files have changed!". Bump it by hand.
    ignore:
      - dependency-name: maturin
    groups:
      uv:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    target-branch: dev
    groups:
      actions:
        patterns: ["*"]
