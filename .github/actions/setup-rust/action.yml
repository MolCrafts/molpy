name: setup-rust
description: >
  Install the toolchain a rust-toolchain.toml pins (with extra targets or
  components), and cache the build when a cache key is given.
inputs:
  toolchain-dir:
    description: Directory whose rust-toolchain.toml pins the compiler
    default: "."
  targets:
    description: Extra rustup targets, space-separated
    default: ""
  components:
    description: Extra rustup components, space-separated
    default: ""
  cache:
    description: Cache key (one per kind of build); empty caches nothing
    default: ""
  workspaces:
    description: Swatinem/rust-cache workspaces, `root -> target`
    default: ". -> target"
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ inputs.toolchain-dir }}
      env:
        TARGETS: ${{ inputs.targets }}
        COMPONENTS: ${{ inputs.components }}
      run: |
        rustup toolchain install
        [ -z "$TARGETS" ] || rustup target add $TARGETS
        [ -z "$COMPONENTS" ] || rustup component add $COMPONENTS
    - if: inputs.cache != ''
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cache }}-${{ runner.os }}
        workspaces: ${{ inputs.workspaces }}
