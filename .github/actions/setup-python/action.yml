name: setup-python
description: Python on PATH, and uv with its cache.
inputs:
  python-version:
    description: Python on PATH (uv calls name their own with --python)
    default: "3.12"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
    - uses: astral-sh/setup-uv@v10.2.0
