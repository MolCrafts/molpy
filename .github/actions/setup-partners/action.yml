name: setup-partners
description: >
  Check every partner .github/partners.env names out next to this repository
  (../<name>, the layout path dependencies expect), at the commit
  scripts/partners.py resolves, and export its absolute path as <NAME>_DIR.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        for name in $(sed -n 's/^\([A-Z][A-Z0-9_]*\)_REPOSITORY=.*/\1/p' .github/partners.env); do
          dir="../${name,,}"
          python3 scripts/partners.py fetch "$name" "$dir"
          echo "${name}_DIR=$(python3 -c 'import os, sys; print(os.path.abspath(sys.argv[1]))' "$dir")" >> "$GITHUB_ENV"
        done
