name: nightly
'on':
  schedule:
  - cron: 17 3 * * 1
  workflow_dispatch:
    inputs:
      packages:
        description: Build development wheels
        type: boolean
        default: false
      publish:
        description: Publish the requested development wheels (explicit opt-in)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: nightly-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  context:
    permissions:
      contents: read
    name: nightly
    uses: MolCrafts/molcrafts-ci/.github/workflows/context.yml@1ebdbdcf3d43411fdcc294736c5117d71c6350f9
    with:
      profile: rust-python
  measure:
    name: nightly / measure
    needs: context
    if: needs.context.outputs.nightly == 'true'
    runs-on: ubuntu-latest
    env:
      TRACK: --track
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ needs.context.outputs.source-ref }}
    - uses: MolCrafts/molcrafts-ci/actions/setup-molci@1ebdbdcf3d43411fdcc294736c5117d71c6350f9
    - uses: MolCrafts/molcrafts-ci/actions/setup-rust@1ebdbdcf3d43411fdcc294736c5117d71c6350f9
      with:
        components: llvm-tools-preview
        cache: snapshot
    - uses: MolCrafts/molcrafts-ci/actions/setup-python@1ebdbdcf3d43411fdcc294736c5117d71c6350f9
    - name: Measure the Rust core
      id: measure
      run: |
        molci run measure-rust
    - name: Test and coverage snapshots
      if: ${{ !cancelled() && steps.measure.outcome == 'success' }}
      run: |
        GITHUB_SHA=$(git rev-parse HEAD)
        export GITHUB_SHA
        export GITHUB_REF=refs/heads/dev
        args=(--out .ci-out/snapshots --cargo-test .ci-out/cargo-test.log --coverage-producer llvm-cov)
        [ ! -f .ci-out/lcov.info ] || args+=(--coverage .ci-out/lcov.info --coverage-format lcov)
        molci snapshot "${args[@]}" ${TRACK:+"$TRACK"}
    - name: Conformance snapshot
      if: ${{ !cancelled() }}
      run: |
        GITHUB_SHA=$(git rev-parse HEAD)
        export GITHUB_SHA
        export GITHUB_REF=refs/heads/dev
        molci run measure-conformance
    - if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ci-snapshots
        if-no-files-found: ignore
        path: |
          .ci-out/snapshots/tests.json
          .ci-out/snapshots/coverage.json
          .ci-out/snapshots/conformance.json
  submit:
    name: nightly / submit
    needs:
    - context
    - measure
    if: needs.context.outputs.nightly == 'true' && (!cancelled()) && (needs.measure.result != 'skipped')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      continue-on-error: true
      with:
        name: ci-snapshots
        path: snapshots
    - if: ${{ hashFiles('snapshots/*.json') != '' }}
      uses: MolCrafts/molcrafts-ci/actions/submit@1ebdbdcf3d43411fdcc294736c5117d71c6350f9
      with:
        snapshot-path: snapshots/*.json
        project: molpy
        ssh-key: ${{ secrets.MOLCRAFTS_CI_SSH_KEY }}
  version:
    name: nightly / version
    needs: context
    if: needs.context.outputs.nightly == 'true' && inputs.packages
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.context.outputs.source-ref }}
    - id: v
      run: |
        python3 - <<'PYCODE'
        import json, os, subprocess, tomllib, urllib.error, urllib.request
        from pathlib import Path
        base = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))["workspace"]["package"]["version"]
        sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
        stamp = int(subprocess.check_output(["git", "show", "-s", "--format=%ct", "HEAD"], text=True))
        version = f"{base}.dev{stamp}{int(sha[:12], 16)}"
        build = True
        url = f"https://pypi.org/pypi/molcrafts-molpy-nightly/{version}/json"
        try:
            with urllib.request.urlopen(url, timeout=30) as response:
                json.load(response)
            build = False
        except urllib.error.HTTPError as exc:
            if exc.code != 404:
                raise
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            print(f"version={version}", file=output)
            print(f"build={str(build).lower()}", file=output)
        PYCODE
  wheels:
    if: needs.context.outputs.nightly == 'true' && needs.version.outputs.build == 'true'
    name: nightly / wheels (${{ matrix.os }})
    needs:
    - context
    - version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.context.outputs.source-ref }}
    - uses: MolCrafts/molcrafts-ci/actions/setup-python@1ebdbdcf3d43411fdcc294736c5117d71c6350f9
    - name: Stamp the dev version and the nightly name
      run: |
        python - "${{ needs.version.outputs.version }}" <<'PY'
        import pathlib, re, sys
        p = pathlib.Path("molpy/pyproject.toml")
        t = p.read_text(encoding="utf-8")
        t = re.sub(r'^name\s*=\s*"molcrafts-molpy"', 'name = "molcrafts-molpy-nightly"', t, count=1, flags=re.M)
        # The release version comes from Cargo.toml (dynamic); a nightly states
        # its PEP 440 dev version here instead.
        t = re.sub(r'^dynamic\s*=\s*\["version"\]', f'version = "{sys.argv[1]}"', t, count=1, flags=re.M)
        p.write_text(t, encoding="utf-8")
        PY
    - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
      with:
        working-directory: molpy
        manylinux: auto
        command: build
        args: --release --out dist ${{ matrix.os == 'macos-latest' && '--target universal2-apple-darwin' || '' }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: nightly-wheels-${{ matrix.os }}
        path: molpy/dist
  pypi:
    name: nightly / pypi
    needs:
    - context
    - version
    - wheels
    if: needs.context.outputs.nightly == 'true' && inputs.publish && needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi-nightly
      url: https://pypi.org/p/molcrafts-molpy-nightly
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        path: dist
        pattern: nightly-wheels-*
        merge-multiple: true
    - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
      with:
        packages-dir: dist
        skip-existing: true
