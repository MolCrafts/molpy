name: nightly

# Nightly snapshots and packages build one immutable dev commit selected by
# molcrafts-ci. Only upstream schedules/manual nightly runs can publish.
# Measurement uses that commit as provenance; submit holds the deploy key
# in a separate job. Language-specific packaging stays in this repository.

'on':
  schedule:
  - cron: 37 3 * * *
  workflow_dispatch: null

permissions:
  contents: read

# Independent workflow/event/ref groups; feature pushes supersede older runs.
concurrency:
  group: nightly-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # Where this run happens, decided once: MolCrafts/molcrafts-ci/actions/ci-context.
  context:
    permissions:
      contents: read
    name: nightly / context
    uses: MolCrafts/molcrafts-ci/.github/workflows/context.yml@b2c4441faa0743987a82bbc53d7ff9d7c2f974aa

  measure:
    name: nightly / measure
    needs: context
    if: needs.context.outputs.nightly == 'true'
    runs-on: ubuntu-latest
    env:
      MATURIN_PEP517_ARGS: --locked
      PYTHONWARNDEFAULTENCODING: '1'
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: ${{ needs.context.outputs.source-ref }}
    - uses: MolCrafts/molcrafts-ci/actions/setup-python@b2c4441faa0743987a82bbc53d7ff9d7c2f974aa
    - uses: MolCrafts/molcrafts-ci/actions/setup-partners@b2c4441faa0743987a82bbc53d7ff9d7c2f974aa
    - uses: MolCrafts/molcrafts-ci/actions/setup-rust@b2c4441faa0743987a82bbc53d7ff9d7c2f974aa
      with:
        toolchain-dir: ../molrs
        cache: molrs-python
        workspaces: ../molrs/molrs-python -> ../target
    - run: |
        uv run --locked --extra dev --with pytest-cov python -m pytest tests/ \
          --junitxml=.ci-out/junit.xml \
          --cov=molpy --cov-branch --cov-report=json:.ci-out/coverage.json || true
    - if: ${{ hashFiles('.ci-out/junit.xml') != '' }}
      run: |
        GITHUB_SHA=$(git rev-parse HEAD)
        export GITHUB_SHA
        export GITHUB_REF=refs/heads/dev
        uvx --from "git+https://github.com/MolCrafts/molcrafts-ci@$(sed -n 's/^CI_REF=//p' .github/partners.env)" molci snapshot \
          --out .ci-out/snapshots --junit .ci-out/junit.xml --coverage .ci-out/coverage.json \
          --track
    - uses: actions/upload-artifact@v7
      with:
        name: ci-snapshots
        if-no-files-found: ignore
        path: .ci-out/snapshots/*.json

  submit:
    name: nightly / submit
    needs:
    - context
    - measure
    if: needs.context.outputs.nightly == 'true' && (!cancelled()) && (needs.measure.result != 'skipped')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v8
      continue-on-error: true
      with:
        name: ci-snapshots
        path: snapshots
    - if: ${{ hashFiles('snapshots/*.json') != '' }}
      uses: MolCrafts/molcrafts-ci/actions/submit@b2c4441faa0743987a82bbc53d7ff9d7c2f974aa
      with:
        snapshot-path: snapshots/*.json
        project: molpy
        ssh-key: ${{ secrets.MOLCRAFTS_CI_SSH_KEY }}

  build:
    name: nightly / build
    needs: context
    if: needs.context.outputs.nightly == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.context.outputs.source-ref }}
    - uses: MolCrafts/molcrafts-ci/actions/setup-python@b2c4441faa0743987a82bbc53d7ff9d7c2f974aa
      with:
        python-version: '3.14'
    - name: Stamp the dev version and the nightly names
      run: |
        python - "$(date -u +%Y%m%d%H%M)" <<'PY'
        import pathlib, re, sys
        v = pathlib.Path("src/molpy/version.py")
        t = v.read_text(encoding="utf-8")
        base = re.search(r'^version\s*=\s*"(.*?)"', t, flags=re.M).group(1)
        dev = f"{base}.dev{sys.argv[1]}"
        print(f"nightly version: {dev}")
        v.write_text(re.sub(r'^version\s*=\s*".*?"', f'version = "{dev}"', t, count=1, flags=re.M), encoding="utf-8")
        p = pathlib.Path("pyproject.toml")
        t = p.read_text(encoding="utf-8")
        t = re.sub(r'^name\s*=\s*"molcrafts-molpy"', 'name = "molcrafts-molpy-nightly"', t, count=1, flags=re.M)
        t, n = re.subn(r'"molcrafts-molrs>=(\d+)\.(\d+)\.\d+,<\d+\.\d+"', r'"molcrafts-molrs-nightly>=\1.\2.0.dev0"', t, count=1)
        if n != 1:
            raise SystemExit("molrs pin not found in pyproject.toml")
        t = re.sub(r'\n\[tool\.uv\.sources\]\n(?:[^\[].*\n|\n)*', '\n', t, count=1)
        p.write_text(t, encoding="utf-8")
        PY
    - run: python scripts/check.py package
    - uses: actions/upload-artifact@v7
      with:
        name: nightly-dist
        path: dist

  pypi:
    name: nightly / pypi
    needs: [context, build]
    if: needs.context.outputs.nightly == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi-nightly
      url: https://pypi.org/p/molcrafts-molpy-nightly
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: nightly-dist
        path: dist
    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist
        skip-existing: true
