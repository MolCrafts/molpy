name: docs

# The site built from `.[doc]` in a fresh env, then zensical, --strict: any
# warning (an unresolved mkdocstrings reference included) fails. Cloudflare
# Pages deploys it from MolCrafts itself (its Git integration), so no job here
# deploys. The user-guide notebooks are executed by scripts/render_notebooks.py
# when they change, and their rendered pages are committed.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

permissions:
  contents: read

# Independent workflow/event/ref groups; feature pushes supersede older runs.
concurrency:
  group: docs-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master","refs/heads/main"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Where this run happens, decided once: MolCrafts/molcrafts-ci/actions/ci-context.
  context:
    name: docs / context
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.context.outputs.tier }}
      upstream: ${{ steps.context.outputs.upstream }}
      integration: ${{ steps.context.outputs.integration }}
      skip-pr: ${{ steps.context.outputs.skip-pr }}
      publish: ${{ steps.context.outputs.publish }}
    steps:
      - id: context
        uses: MolCrafts/molcrafts-ci/actions/ci-context@9da33fd962308312150ae98e3f4fa3e21368be52

  build:
    name: docs / build
    needs: context
    # A pull request inside a fork was already run by its push.
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@9da33fd962308312150ae98e3f4fa3e21368be52
      - uses: MolCrafts/molcrafts-ci/actions/setup-partners@9da33fd962308312150ae98e3f4fa3e21368be52
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@9da33fd962308312150ae98e3f4fa3e21368be52
        with:
          toolchain-dir: ../molrs
          cache: molrs-python
          workspaces: ../molrs/molrs-python -> ../target
      - run: python scripts/check.py docs
