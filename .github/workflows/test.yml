name: test

# The tests a laptop cannot run: every OS. Static checks (ruff, ty, the
# workflow scheme) run only locally, at pre-commit and in the pre-push
# `scripts/check.py verify`; this workflow does not repeat them. The unit
# suite runs once per leg against the partners built from the commits
# scripts/partners.py pins in .github/partners.env, in two tiers
# (`test / context` decides):
#
#   fast  a feature-branch push to MolCrafts: Linux, Python 3.12.
#   full  every push to a fork (proven before its pull request), dev, master
#         and master on MolCrafts, pull requests and dispatches: Linux,
#         macOS and Windows on 3.12; Linux additionally checks 3.14.
# OS and interpreter coverage use four legs instead of six.
#
# The strict docs build runs in the Linux 3.12 leg, after its tests, in the
# same environment: the molrs it imports is the one that leg built and
# tested, not a second compile.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: read

# Independent workflow/event/ref groups; feature pushes supersede older runs.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

env:
  # uv builds molrs through maturin's PEP 517 hook; this makes that cargo
  # build --locked as well.
  MATURIN_PEP517_ARGS: --locked
  # Every text-mode open without encoding= warns, and pytest's "error" filter
  # fails it: it would decode with cp1252 on Windows only (pyproject.toml).
  PYTHONWARNDEFAULTENCODING: "1"

jobs:
  # Where this run happens, decided once: MolCrafts/molcrafts-ci/actions/ci-context.
  context:
    name: test / context
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.context.outputs.tier }}
      upstream: ${{ steps.context.outputs.upstream }}
      integration: ${{ steps.context.outputs.integration }}
      skip-pr: ${{ steps.context.outputs.skip-pr }}
      publish: ${{ steps.context.outputs.publish }}
    steps:
      - id: context
        uses: MolCrafts/molcrafts-ci/actions/ci-context@03352583738d9424ce37996ef9e04df9290087ba

  python:
    name: test / python (${{ matrix.os }}, ${{ matrix.python }})
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.context.outputs.tier == 'full' && '[{"os":"ubuntu-latest","python":"3.12"},{"os":"ubuntu-latest","python":"3.14"},{"os":"macos-latest","python":"3.12"},{"os":"windows-latest","python":"3.12"}]' || '[{"os":"ubuntu-latest","python":"3.12"}]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@03352583738d9424ce37996ef9e04df9290087ba
        with:
          python-version: ${{ matrix.python }}
      - uses: MolCrafts/molcrafts-ci/actions/setup-partners@03352583738d9424ce37996ef9e04df9290087ba
      # molrs/rust-toolchain.toml pins the compiler that builds the molrs wheel.
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@03352583738d9424ce37996ef9e04df9290087ba
        with:
          toolchain-dir: ../molrs
          cache: molrs-python
          workspaces: ../molrs/molrs-python -> ../target
      - name: Direct dependencies
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: python scripts/check.py dependencies
      # The pre-push test gate, plus what the report reads: JUnit and coverage.
      - name: Unit tests
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: python scripts/check.py --report .ci-out test
      # Counts and coverage in the run and pull request summary; report only.
      - name: Report
        if: ${{ !cancelled() }}
        uses: MolCrafts/molcrafts-ci/actions/report@03352583738d9424ce37996ef9e04df9290087ba
        with:
          title: test / python (${{ matrix.os }}, ${{ matrix.python }})
          junit: .ci-out/junit.xml
          coverage: .ci-out/coverage.json
      # The site as Cloudflare Pages builds it, zensical --strict: any warning
      # (an unresolved mkdocstrings reference included) fails. Cloudflare
      # Pages deploys it from MolCrafts itself, so no job here deploys. The
      # user-guide notebooks are executed by scripts/render_notebooks.py when
      # they change, and their rendered pages are committed.
      - name: Docs
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: python scripts/check.py docs
