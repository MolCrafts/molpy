name: test

# The unit suite against molrs built from the commit scripts/partners.py
# resolves (molrs's dev, or its branch named like this one), in two tiers
# (`test / tier` decides):
#
#   fast  a feature-branch push to MolCrafts: Linux, Python 3.12.
#   full  every push to a fork (proven before its pull request), dev, master
#         and main on MolCrafts, pull requests, tags and dispatches: Linux,
#         macOS and Windows x Python 3.12 and 3.14 (the supported range's
#         ends; release.yml tests 3.13 too).
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master","refs/heads/main"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

env:
  # uv builds molrs through maturin's PEP 517 hook; this makes that cargo
  # build --locked as well.
  MATURIN_PEP517_ARGS: --locked
  # Every text-mode open without encoding= warns, and pytest's "error" filter
  # fails it: it would decode with cp1252 on Windows only (pyproject.toml).
  PYTHONWARNDEFAULTENCODING: "1"

jobs:
  tier:
    name: test / tier
    # A pull request inside a fork was already run, full tier, by its push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.repository_owner == 'MolCrafts'
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.tier.outputs.full }}
    steps:
      - id: tier
        run: echo "full=${{ github.repository_owner != 'MolCrafts' || contains(fromJSON('["dev","master","main"]'), github.ref_name) || github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') }}" | tee -a "$GITHUB_OUTPUT"

  python:
    name: test / python (${{ matrix.os }}, ${{ matrix.python }})
    needs: tier
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.tier.outputs.full == 'true' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
        python: ${{ fromJSON(needs.tier.outputs.full == 'true' && '["3.12","3.14"]' || '["3.12"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@master
        with:
          python-version: ${{ matrix.python }}
      - uses: MolCrafts/molcrafts-ci/actions/setup-partners@master
      # molrs/rust-toolchain.toml pins the compiler that builds the molrs wheel.
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@master
        with:
          toolchain-dir: ../molrs
          cache: molrs-python
          workspaces: ../molrs/molrs-python -> ../target
      - run: uv run --locked --python ${{ matrix.python }} --extra dev python -m pytest tests/ -n auto
