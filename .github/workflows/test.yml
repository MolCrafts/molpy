name: test

# The unit suite against the partners built from the commits scripts/partners.py
# resolves (molrs's dev, mollog's and molcfg's master, or each one's branch
# named like this one), in two tiers
# (`test / context` decides):
#
#   fast  a feature-branch push to MolCrafts: Linux, Python 3.12.
#   full  every push to a fork (proven before its pull request), dev, master
#         and main on MolCrafts, pull requests, tags and dispatches: Linux,
#         macOS and Windows x Python 3.12 and 3.14 (the supported range's
#         ends; release.yml tests 3.13 too).
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

permissions:
  contents: read

# One group per file, workflow, event and ref. Under workflow_call (release.yml
# running lint/test) github.workflow and github.event_name are the caller's, so
# a called run never shares, and so never cancels, a direct run's group.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master","refs/heads/main"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

env:
  # uv builds molrs through maturin's PEP 517 hook; this makes that cargo
  # build --locked as well.
  MATURIN_PEP517_ARGS: --locked
  # Every text-mode open without encoding= warns, and pytest's "error" filter
  # fails it: it would decode with cp1252 on Windows only (pyproject.toml).
  PYTHONWARNDEFAULTENCODING: "1"

jobs:
  # Where this run happens, decided once: MolCrafts/molcrafts-ci/actions/ci-context.
  context:
    name: test / context
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.context.outputs.tier }}
      upstream: ${{ steps.context.outputs.upstream }}
      integration: ${{ steps.context.outputs.integration }}
      skip-pr: ${{ steps.context.outputs.skip-pr }}
      cancel: ${{ steps.context.outputs.cancel }}
    steps:
      - id: context
        uses: MolCrafts/molcrafts-ci/actions/ci-context@master

  python:
    name: test / python (${{ matrix.os }}, ${{ matrix.python }})
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.context.outputs.tier == 'full' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
        python: ${{ fromJSON(needs.context.outputs.tier == 'full' && '["3.12","3.14"]' || '["3.12"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@master
        with:
          python-version: ${{ matrix.python }}
      - uses: MolCrafts/molcrafts-ci/actions/setup-partners@master
      # molrs/rust-toolchain.toml pins the compiler that builds the molrs wheel.
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@master
        with:
          toolchain-dir: ../molrs
          cache: molrs-python
          workspaces: ../molrs/molrs-python -> ../target
      # The pre-push hook's command, plus what the report reads: JUnit and
      # coverage (pytest-cov, as nightly.yml measures it).
      - run: >-
          uv run --locked --python ${{ matrix.python }} --extra dev --with pytest-cov
          python -m pytest tests/ -n auto --junitxml=.ci-out/junit.xml
          --cov=molpy --cov-branch --cov-report=json:.ci-out/coverage.json
      # Counts and coverage in the run and pull request summary; report only.
      - name: Report
        if: ${{ !cancelled() }}
        uses: MolCrafts/molcrafts-ci/actions/report@master
        with:
          title: test / python (${{ matrix.os }}, ${{ matrix.python }})
          junit: .ci-out/junit.xml
          coverage: .ci-out/coverage.json
