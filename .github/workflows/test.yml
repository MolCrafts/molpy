name: test
'on':
  push:
    branches:
    - dev
    - master
  pull_request:
    branches:
    - dev
    - master
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}
defaults:
  run:
    shell: bash
jobs:
  context:
    name: test
    uses: MolCrafts/molcrafts-ci/.github/workflows/context.yml@a10699d9198ef1fa210a9fa79ece62cb0cb63e44
    with:
      profile: rust-python
  native:
    name: test / native
    needs: context
    if: needs.context.outputs.validate == 'true' && needs.context.outputs.native == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: MolCrafts/molcrafts-ci/actions/setup-molci@a10699d9198ef1fa210a9fa79ece62cb0cb63e44
    - uses: MolCrafts/molcrafts-ci/actions/setup-rust@a10699d9198ef1fa210a9fa79ece62cb0cb63e44
      with:
        cache: native
    - uses: MolCrafts/molcrafts-ci/actions/setup-python@a10699d9198ef1fa210a9fa79ece62cb0cb63e44
    - uses: MolCrafts/molcrafts-ci/actions/setup-wasm@a10699d9198ef1fa210a9fa79ece62cb0cb63e44
    - run: molci platform native
  platform:
    name: test / platform (${{ matrix.lane }})
    needs: context
    if: needs.context.outputs.validate == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.context.outputs.matrix) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: MolCrafts/molcrafts-ci/actions/setup-molci@a10699d9198ef1fa210a9fa79ece62cb0cb63e44
    - uses: MolCrafts/molcrafts-ci/actions/setup-rust@a10699d9198ef1fa210a9fa79ece62cb0cb63e44
      with:
        cache: native
    - uses: MolCrafts/molcrafts-ci/actions/setup-python@a10699d9198ef1fa210a9fa79ece62cb0cb63e44
    - if: matrix.lane == 'wasm'
      uses: MolCrafts/molcrafts-ci/actions/setup-wasm@a10699d9198ef1fa210a9fa79ece62cb0cb63e44
    - run: molci platform ${{ matrix.lane }}
  result:
    name: test / result
    needs:
    - context
    - native
    - platform
    if: always() && needs.context.outputs.validate == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: MolCrafts/molcrafts-ci/actions/validation-result@a10699d9198ef1fa210a9fa79ece62cb0cb63e44
      with:
        needs: ${{ toJSON(needs) }}
