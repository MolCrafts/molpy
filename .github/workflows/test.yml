name: test

# Every test gate of scripts/check.sh, in two tiers (`test / context` decides):
#
#   fast  a feature-branch push to MolCrafts: core Rust tests and the Python
#         suite on Linux.
#   full  every push to a fork (proven before its pull request), dev, master
#         and master on MolCrafts, pull requests, tags and dispatches:
#         + ffi/cxx/ext/package, the OS
#         matrix, the feature matrix, C API, WASM and molrec's conformance
#         suite (mrec).
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# One group per file, workflow, event and ref. Under workflow_call (release.yml
# running lint/test) github.workflow and github.event_name are the caller's, so
# a called run never shares, and so never cancels, a direct run's group.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  # Where this run happens, decided once: MolCrafts/molcrafts-ci/actions/ci-context.
  context:
    name: test / context
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.context.outputs.tier }}
      upstream: ${{ steps.context.outputs.upstream }}
      integration: ${{ steps.context.outputs.integration }}
      skip-pr: ${{ steps.context.outputs.skip-pr }}
      publish: ${{ steps.context.outputs.publish }}
    steps:
      - id: context
        uses: MolCrafts/molcrafts-ci/actions/ci-context@cc46e4eb85fdcfb950d9a4df02c2e04e94ba90f7

  rust:
    name: test / rust
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@cc46e4eb85fdcfb950d9a4df02c2e04e94ba90f7
        with:
          cache: native
      # Native lint and tests share the checkout and Cargo cache; no second
      # runner compiles the same binder graph merely to run clippy.
      - name: Native lint
        run: scripts/check.sh clippy
      - name: Rustdoc
        run: scripts/check.sh doc
      - name: Native tests and package
        run: scripts/check.sh --report .ci-out test ${{ needs.context.outputs.tier == 'full' && 'ffi cxx ext package' || '' }}
      # The counts in the run and pull request summary; report only. No
      # coverage here: instrumenting the build is the nightly's job.
      - name: Report
        if: ${{ !cancelled() }}
        uses: MolCrafts/molcrafts-ci/actions/report@cc46e4eb85fdcfb950d9a4df02c2e04e94ba90f7
        with:
          title: test / rust
          cargo-test: .ci-out/cargo-test.log

  # abi3-py312: one native artifact per OS, so one Python per OS.
  python:
    name: test / python (${{ matrix.os }})
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.context.outputs.tier == 'full' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@cc46e4eb85fdcfb950d9a4df02c2e04e94ba90f7
        with:
          cache: python
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@cc46e4eb85fdcfb950d9a4df02c2e04e94ba90f7
      - run: scripts/check.sh --report .ci-out python
      # The counts and the Python layer's coverage in the run and pull
      # request summary; report only.
      - name: Report
        if: ${{ !cancelled() }}
        uses: MolCrafts/molcrafts-ci/actions/report@cc46e4eb85fdcfb950d9a4df02c2e04e94ba90f7
        with:
          title: test / python (${{ matrix.os }})
          junit: .ci-out/junit.xml
          coverage: .ci-out/coverage.json

  features:
    name: test / features
    needs: context
    if: needs.context.outputs.skip-pr != 'true' && needs.context.outputs.tier == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@cc46e4eb85fdcfb950d9a4df02c2e04e94ba90f7
        with:
          cache: features
      - run: scripts/check.sh features

  capi:
    name: test / capi${{ matrix.os == 'windows-latest' && ' (windows-latest)' || '' }}
    needs: context
    if: needs.context.outputs.skip-pr != 'true' && needs.context.outputs.tier == 'full'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@cc46e4eb85fdcfb950d9a4df02c2e04e94ba90f7
        with:
          cache: capi
      # Visual Studio is multi-config; use the same configuration for build/test.
      - run: scripts/check.sh capi

  wasm:
    name: test / wasm
    needs: context
    if: needs.context.outputs.skip-pr != 'true' && needs.context.outputs.tier == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@cc46e4eb85fdcfb950d9a4df02c2e04e94ba90f7
        with:
          cache: wasm
      - uses: ./.github/actions/setup-wasm
      - run: scripts/check.sh wasm

  # molrec's conformance suite through molrs.io's *.mrec doors, molrec at the
  # immutable commit declared in .github/partners.env.
  mrec:
    name: test / mrec
    needs: context
    if: needs.context.outputs.skip-pr != 'true' && needs.context.outputs.tier == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@cc46e4eb85fdcfb950d9a4df02c2e04e94ba90f7
        with:
          cache: mrec
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@cc46e4eb85fdcfb950d9a4df02c2e04e94ba90f7
      - run: scripts/check.sh mrec
