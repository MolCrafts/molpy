name: release

# A `v*` tag on MolCrafts/molrs: guard -> build -> every channel. crates.io
# (molcrafts-molrs), npm (@molcrafts/molrs), PyPI (desktop abi3 wheels + the
# Pyodide wheel), and the GitHub Release with the C API archives (lib +
# header + LICENSE + sha256).
#
# No lint and no test suite here: the tagged commit was already proven, by
# the pre-push gate and by test.yml's full tier on master. `release / guard`
# reads that commit's `test / *` check runs and refuses a commit whose CI is
# not green; then this workflow only builds and publishes. `cargo publish`
# verifies the crate tarball, once.
#
# A dispatch is the dry run, on any branch, fork or upstream: the same guard
# (any green `test / *` runs of the commit) and builds, `cargo publish
# --dry-run` and `npm pack --dry-run`, and no upload anywhere. Building and uploading are separate jobs: every upload job
# (release / crate, npm, pypi, github) runs only when `release / context`
# says `publish` (a `v*` tag pushed to MolCrafts), and tests no raw event or
# ref. Every upload skips a version the registry already has, so a partial
# release is retried by re-running the tag's run.
#
# Trusted publishing names this file, release.yml, and one environment per
# registry: crates-io, npm, pypi. A dispatch never enters an environment.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One group per file, workflow, event and ref; a run is never cancelled.
concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # Where this run happens, decided once: MolCrafts/molcrafts-ci/actions/ci-context.
  context:
    name: release / context
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.context.outputs.tier }}
      upstream: ${{ steps.context.outputs.upstream }}
      integration: ${{ steps.context.outputs.integration }}
      skip-pr: ${{ steps.context.outputs.skip-pr }}
      publish: ${{ steps.context.outputs.publish }}
    steps:
      - id: context
        uses: MolCrafts/molcrafts-ci/actions/ci-context@4e5a51d0c60518e028ed118abbd1adb4a04d28ae

  guard:
    name: release / guard
    needs: context
    if: github.event_name == 'workflow_dispatch' || needs.context.outputs.upstream == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The tag is the package version, on master
        if: needs.context.outputs.publish == 'true'
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::tag $GITHUB_REF_NAME is not v$version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || { echo "::error::tag is not on master"; exit 1; }
      # The commit's test.yml run, instead of running it again. A tag waits
      # for every job of the full tier to have succeeded on this SHA (pushed
      # to master first); a dispatch, for whatever `test / *` runs the commit
      # has. Any failed run fails the release; a re-run's newer result wins.
      - name: The commit's CI is green
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ needs.context.outputs.publish }}
          REQUIRED: >-
            test / context|test / rust|test / python (ubuntu-latest)|test / python (macos-latest)|test / python (windows-latest)|test / docs|test / capi|test / capi (windows-latest)|test / wasm|test / mrec
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys, time

          repo, sha = os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_SHA"]
          required = set(os.environ["REQUIRED"].split("|")) if os.environ["PUBLISH"] == "true" else set()
          deadline = time.monotonic() + 90 * 60
          query = '.check_runs[] | select(.name | startswith("test / ")) | {name, status, conclusion, started_at}'
          while True:
              out = subprocess.run(
                  ["gh", "api", "--paginate", f"repos/{repo}/commits/{sha}/check-runs?filter=all&per_page=100", "--jq", query],
                  check=True, capture_output=True, text=True,
              ).stdout
              latest = {}
              for run in sorted((json.loads(line) for line in out.splitlines() if line.strip()),
                                key=lambda r: r["started_at"] or ""):
                  # A skipped run (an in-fork pull request) never hides a real one.
                  if run["conclusion"] == "skipped" and run["name"] in latest:
                      continue
                  latest[run["name"]] = run
              failed = sorted(n for n, r in latest.items()
                              if r["status"] == "completed" and r["conclusion"] not in ("success", "skipped", "neutral"))
              if failed:
                  sys.exit(f"::error::{sha} has failed CI: {', '.join(failed)}")
              pending = sorted(n for n, r in latest.items() if r["status"] != "completed")
              missing = sorted(n for n in required if (latest.get(n) or {}).get("conclusion") != "success")
              if latest and not pending and not missing:
                  print(f"{sha}: {len(latest)} test runs green")
                  break
              if time.monotonic() > deadline:
                  sys.exit(f"::error::{sha}: CI not green in time (pending: {pending or '-'}; missing: {missing or '-'})")
              print(f"waiting: pending {pending or '-'}, missing {missing or '-'}", flush=True)
              time.sleep(60)
          PY

  # The crate as crates.io would take it: package and verify, upload nothing.
  # Dispatch only; on a tag, `release / crate`'s publish is that verification.
  crate-check:
    name: release / crate (dry run)
    needs: [context, guard]
    if: needs.context.outputs.publish != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@4e5a51d0c60518e028ed118abbd1adb4a04d28ae
      - name: The crate ships the repository's LICENSE
        run: |
          cmp LICENSE molrs/LICENSE
          cargo package --list --locked --manifest-path molrs/Cargo.toml | grep -qx LICENSE
      - run: cargo publish --dry-run --locked --manifest-path molrs/Cargo.toml

  crate:
    name: release / crate
    needs: [context, guard]
    if: needs.context.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@4e5a51d0c60518e028ed118abbd1adb4a04d28ae
      - name: The crate ships the repository's LICENSE
        run: |
          cmp LICENSE molrs/LICENSE
          cargo package --list --locked --manifest-path molrs/Cargo.toml | grep -qx LICENSE
      - id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 --manifest-path molrs/Cargo.toml | jq -r '.packages[0].version')
          # crates.io rejects a request without a User-Agent.
          if curl -sfL -A "molrs-release/1.0" "https://crates.io/api/v1/crates/molcrafts-molrs/$VERSION" >/dev/null; then
            echo "molcrafts-molrs@$VERSION is already on crates.io"
            exit 0
          fi
          set +e
          OUT=$(cargo publish --locked --manifest-path molrs/Cargo.toml 2>&1)
          CODE=$?
          set -e
          printf '%s\n' "$OUT"
          # Index lag after a successful earlier publish.
          [ "$CODE" -eq 0 ] || printf '%s\n' "$OUT" | grep -qiE 'already exists|already uploaded' || exit "$CODE"

  # The npm package, built and packed as npm would take it; the upload job
  # publishes exactly this directory.
  npm-pack:
    name: release / npm (dry run)
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@4e5a51d0c60518e028ed118abbd1adb4a04d28ae
        with:
          cache: release-wasm
      - uses: ./.github/actions/setup-wasm
      - working-directory: molrs-wasm
        run: wasm-pack build --release --target bundler --scope molcrafts --out-name molrs -- --locked
      - working-directory: molrs-wasm/pkg
        run: npm pack --dry-run
      - uses: actions/upload-artifact@v7
        with:
          name: npm-pkg
          path: molrs-wasm/pkg

  npm:
    name: release / npm
    needs: [context, guard, npm-pack]
    if: needs.context.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-wasm
        with:
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: npm-pkg
          path: molrs-wasm/pkg
      # setup-node's registry-url exports a placeholder NODE_AUTH_TOKEN that
      # would override OIDC; empty, npm >= 11.5 publishes through the id-token.
      - working-directory: molrs-wasm/pkg
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm"
          else
            npm publish --access public --provenance
          fi

  # Desktop abi3 wheels, one interpreter each. macOS arm64 and x64 are
  # separate wheels (PyPI rejected universal2 fat wheels).
  wheels:
    name: release / wheels (${{ matrix.artifact }})
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: "", artifact: linux-x64, manylinux: auto }
          # manylinux 2_28, not `auto`: zarrs pulls blosc-src -> snappy_src,
          # whose C++ wants -std=c++14, which the manylinux2014 aarch64 cross
          # g++ lacks. The wheel needs glibc >= 2.28.
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, artifact: linux-aarch64, manylinux: "2_28" }
          - { os: macos-latest, target: aarch64-apple-darwin, artifact: macos-arm64, manylinux: auto }
          - { os: macos-latest, target: x86_64-apple-darwin, artifact: macos-x64, manylinux: auto }
          - { os: windows-latest, target: "", artifact: windows, manylinux: auto }
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@4e5a51d0c60518e028ed118abbd1adb4a04d28ae
        with:
          python-version: "3.14"
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@4e5a51d0c60518e028ed118abbd1adb4a04d28ae
        with:
          cache: release-py-${{ matrix.artifact }}
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: molrs-python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          command: build
          args: --release --locked --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.artifact }}
          path: molrs-python/dist

  # The Pyodide / Emscripten wheel for micropip: no host filesystem, no zarr.
  pyodide:
    name: release / wheels (pyodide)
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@4e5a51d0c60518e028ed118abbd1adb4a04d28ae
        with:
          python-version: "3.14"
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@4e5a51d0c60518e028ed118abbd1adb4a04d28ae
        with:
          targets: wasm32-unknown-emscripten
          cache: release-py-pyodide
      - uses: pypa/cibuildwheel@v4.3.1
        env:
          CIBW_PLATFORM: pyodide
          CIBW_BUILD: cp314-pyodide_wasm32
          CIBW_TEST_SKIP: "*"
          CIBW_ENVIRONMENT_PYODIDE: MATURIN_PEP517_ARGS=--no-default-features
          # Host rustc/cargo stay visible to maturin under pyodide-build.
          CIBW_XBUILD_TOOLS: rustc cargo rustup
          CIBW_BEFORE_BUILD_PYODIDE: rustup target add wasm32-unknown-emscripten
        with:
          package-dir: molrs-python
          output-dir: molrs-python/dist-pyodide
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-pyodide
          path: molrs-python/dist-pyodide

  pypi:
    name: release / pypi
    needs: [context, guard, wheels, pyodide]
    if: needs.context.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  # The C ABI deliverable for external C / C++ / HPC consumers: libmolrs_capi
  # (cdylib + staticlib) and the cbindgen header (docs/interop.md, "Path C").
  capi:
    name: release / capi (${{ matrix.artifact }})
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: "", artifact: linux-x64 }
          - { os: ubuntu-24.04-arm, target: "", artifact: linux-aarch64 }
          - { os: macos-latest, target: aarch64-apple-darwin, artifact: macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, artifact: macos-x64 }
          - { os: windows-latest, target: "", artifact: windows-x64 }
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@4e5a51d0c60518e028ed118abbd1adb4a04d28ae
        with:
          targets: ${{ matrix.target }}
          cache: release-capi-${{ matrix.artifact }}
      - name: Build and package (lib + header + LICENSE + sha256)
        run: |
          target=${{ matrix.target }}
          cargo build --locked --release --manifest-path molrs-capi/Cargo.toml ${target:+--target "$target"}
          VERSION=$(cargo metadata --no-deps --format-version 1 --manifest-path molrs-capi/Cargo.toml | jq -r '.packages[0].version')
          OUT="molrs-capi-${VERSION}-${{ matrix.artifact }}"
          LIBDIR="target/${target:+$target/}release"
          mkdir -p "stage/$OUT"
          cp molrs-capi/include/molrs.h LICENSE "stage/$OUT/"
          found=0
          for f in libmolrs_capi.dylib libmolrs_capi.so libmolrs_capi.a molrs_capi.dll molrs_capi.dll.lib molrs_capi.lib; do
            if [ -f "$LIBDIR/$f" ]; then cp "$LIBDIR/$f" "stage/$OUT/"; found=1; fi
          done
          [ "$found" -eq 1 ]
          tar -C stage -czf "$OUT.tar.gz" "$OUT"
          sha256sum "$OUT.tar.gz" > "$OUT.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: capi-${{ matrix.artifact }}
          path: molrs-capi-*.tar.gz*

  github:
    name: release / github
    needs: [context, guard, capi]
    if: needs.context.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          pattern: capi-*
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
                 --notes "Documentation: https://docs.molcrafts.org/molrs/"
          gh release upload "$GITHUB_REF_NAME" assets/* --clobber
