name: release
'on':
  push:
    tags:
    - v*
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  context:
    permissions:
      contents: read
    name: release
    uses: MolCrafts/molcrafts-ci/.github/workflows/context.yml@72813fc0f78b220dab40d9091244a989ba56c92d
    with:
      profile: rust-python
  guard:
    name: release / guard
    needs: context
    if: needs.context.outputs.skip-pr != 'true' && (github.event_name == 'workflow_dispatch' || needs.context.outputs.upstream == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - uses: MolCrafts/molcrafts-ci/actions/setup-molci@72813fc0f78b220dab40d9091244a989ba56c92d
    - name: The tag is the package version, on master
      if: needs.context.outputs.publish == 'true'
      run: |
        version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
        [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::tag $GITHUB_REF_NAME is not v$version"; exit 1; }
        molci run partners
    - name: Exact upstream master verification
      uses: MolCrafts/molcrafts-ci/actions/release-verify@72813fc0f78b220dab40d9091244a989ba56c92d
      env:
        GH_TOKEN: ${{ github.token }}
      with:
        publish: ${{ needs.context.outputs.publish }}
  crate-check:
    name: release / crate (dry run)
    needs:
    - context
    - guard
    if: needs.context.outputs.skip-pr != 'true' && (needs.context.outputs.publish != 'true')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: MolCrafts/molcrafts-ci/actions/setup-molci@72813fc0f78b220dab40d9091244a989ba56c92d
    - uses: MolCrafts/molcrafts-ci/actions/setup-rust@72813fc0f78b220dab40d9091244a989ba56c92d
    - run: molci run package-crate
  crate:
    name: release / crate
    needs:
    - context
    - guard
    if: needs.context.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: MolCrafts/molcrafts-ci/actions/setup-rust@72813fc0f78b220dab40d9091244a989ba56c92d
    - id: auth
      uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9
    - env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      run: |
        VERSION=$(cargo metadata --no-deps --format-version 1 --manifest-path crates/molrs/Cargo.toml | jq -r '.packages[0].version')
        # crates.io rejects a request without a User-Agent.
        if curl -sfL -A "molrs-release/1.0" "https://crates.io/api/v1/crates/molcrafts-molrs/$VERSION" >/dev/null; then
          echo "molcrafts-molrs@$VERSION is already on crates.io"
          exit 0
        fi
        set +e
        OUT=$(cargo publish --locked --manifest-path crates/molrs/Cargo.toml 2>&1)
        CODE=$?
        set -e
        printf '%s\n' "$OUT"
        # Index lag after a successful earlier publish.
        [ "$CODE" -eq 0 ] || printf '%s\n' "$OUT" | grep -qiE 'already exists|already uploaded' || exit "$CODE"
  npm-pack:
    if: needs.context.outputs.skip-pr != 'true'
    name: release / npm (dry run)
    needs:
    - context
    - guard
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: MolCrafts/molcrafts-ci/actions/setup-molci@72813fc0f78b220dab40d9091244a989ba56c92d
    - uses: MolCrafts/molcrafts-ci/actions/setup-rust@72813fc0f78b220dab40d9091244a989ba56c92d
      with:
        cache: release-wasm
    - uses: MolCrafts/molcrafts-ci/actions/setup-wasm@72813fc0f78b220dab40d9091244a989ba56c92d
    - run: molci run package-wasm
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: npm-pkg
        path: molwasm/pkg
  npm:
    name: release / npm
    needs:
    - context
    - guard
    - npm-pack
    if: needs.context.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: MolCrafts/molcrafts-ci/actions/setup-wasm@72813fc0f78b220dab40d9091244a989ba56c92d
      with:
        registry-url: https://registry.npmjs.org
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: npm-pkg
        path: molwasm/pkg
    - working-directory: molwasm/pkg
      env:
        NODE_AUTH_TOKEN: ''
      run: |
        NAME=$(node -p "require('./package.json').name")
        VERSION=$(node -p "require('./package.json').version")
        if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
          echo "$NAME@$VERSION is already on npm"
        else
          npm publish --access public --provenance
        fi
  wheels:
    if: needs.context.outputs.skip-pr != 'true'
    name: release / wheels (${{ matrix.artifact }})
    needs:
    - context
    - guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          target: ''
          artifact: linux-x64
          manylinux: auto
        - os: ubuntu-latest
          target: aarch64-unknown-linux-gnu
          artifact: linux-aarch64
          manylinux: '2_28'
        - os: macos-latest
          target: aarch64-apple-darwin
          artifact: macos-arm64
          manylinux: auto
        - os: macos-latest
          target: x86_64-apple-darwin
          artifact: macos-x64
          manylinux: auto
        - os: windows-latest
          target: ''
          artifact: windows
          manylinux: auto
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: MolCrafts/molcrafts-ci/actions/setup-python@72813fc0f78b220dab40d9091244a989ba56c92d
      with:
        python-version: '3.14'
    - uses: MolCrafts/molcrafts-ci/actions/setup-rust@72813fc0f78b220dab40d9091244a989ba56c92d
      with:
        cache: release-py-${{ matrix.artifact }}
    - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
      with:
        working-directory: molpy
        target: ${{ matrix.target }}
        manylinux: ${{ matrix.manylinux }}
        command: build
        args: --release --locked --out dist
        sccache: 'true'
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: wheels-${{ matrix.artifact }}
        path: molpy/dist
  pyodide:
    if: needs.context.outputs.skip-pr != 'true'
    name: release / wheels (pyodide)
    needs:
    - context
    - guard
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: MolCrafts/molcrafts-ci/actions/setup-python@72813fc0f78b220dab40d9091244a989ba56c92d
      with:
        python-version: '3.14'
    - uses: MolCrafts/molcrafts-ci/actions/setup-rust@72813fc0f78b220dab40d9091244a989ba56c92d
      with:
        targets: wasm32-unknown-emscripten
        cache: release-py-pyodide
    - uses: pypa/cibuildwheel@b9e566a2b284570af229f6c2a33673410d0389a3
      env:
        CIBW_PLATFORM: pyodide
        CIBW_BUILD: cp314-pyodide_wasm32
        CIBW_TEST_SKIP: '*'
        CIBW_ENVIRONMENT_PYODIDE: MATURIN_PEP517_ARGS=--no-default-features
        CIBW_XBUILD_TOOLS: rustc cargo rustup
        CIBW_BEFORE_BUILD_PYODIDE: rustup target add wasm32-unknown-emscripten
      with:
        package-dir: molpy
        output-dir: molpy/dist-pyodide
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: wheels-pyodide
        path: molpy/dist-pyodide
  pypi:
    name: release / pypi
    needs:
    - context
    - guard
    - wheels
    - pyodide
    if: needs.context.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        path: dist
        pattern: wheels-*
        merge-multiple: true
    - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
      with:
        packages-dir: dist
        skip-existing: true
  capi:
    if: needs.context.outputs.skip-pr != 'true'
    name: release / capi (${{ matrix.artifact }})
    needs:
    - context
    - guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          target: ''
          artifact: linux-x64
        - os: ubuntu-24.04-arm
          target: ''
          artifact: linux-aarch64
        - os: macos-latest
          target: aarch64-apple-darwin
          artifact: macos-arm64
        - os: macos-latest
          target: x86_64-apple-darwin
          artifact: macos-x64
        - os: windows-latest
          target: ''
          artifact: windows-x64
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: MolCrafts/molcrafts-ci/actions/setup-rust@72813fc0f78b220dab40d9091244a989ba56c92d
      with:
        targets: ${{ matrix.target }}
        cache: release-capi-${{ matrix.artifact }}
    - name: Build and package (lib + header + LICENSE + sha256)
      run: |
        target=${{ matrix.target }}
        cargo build --locked --release --manifest-path molc/Cargo.toml ${target:+--target "$target"}
        VERSION=$(cargo metadata --no-deps --format-version 1 --manifest-path molc/Cargo.toml | jq -r '.packages[0].version')
        OUT="molc-${VERSION}-${{ matrix.artifact }}"
        LIBDIR="target/${target:+$target/}release"
        mkdir -p "stage/$OUT"
        cp molc/include/molc.h LICENSE "stage/$OUT/"
        found=0
        for f in libmolc.dylib libmolc.so libmolc.a molc.dll molc.dll.lib molc.lib; do
          if [ -f "$LIBDIR/$f" ]; then cp "$LIBDIR/$f" "stage/$OUT/"; found=1; fi
        done
        [ "$found" -eq 1 ]
        tar -C stage -czf "$OUT.tar.gz" "$OUT"
        sha256sum "$OUT.tar.gz" > "$OUT.tar.gz.sha256"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: capi-${{ matrix.artifact }}
        path: molc-*.tar.gz*
  github:
    name: release / github
    needs:
    - context
    - guard
    - capi
    if: needs.context.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        path: assets
        pattern: capi-*
        merge-multiple: true
    - env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
          || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
               --notes "Documentation: https://docs.molcrafts.org/molrs/"
        gh release upload "$GITHUB_REF_NAME" assets/* --clobber
