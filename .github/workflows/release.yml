name: release

# A `v*` tag on MolCrafts/molpy: guard -> the release test matrix -> the
# pure-Python sdist + wheel to PyPI (trusted publishing) -> the GitHub
# Release. molcrafts-molrs on the major.minor molpy declares must already be
# on PyPI (docs/developer/release-process.md): the matrix -- 3 OS x every
# supported Python -- runs against molrs from PyPI, exactly what the wheel
# declares (`--no-sources` drops the ../molrs path source dev builds from).
#
# A dispatch is the dry run, on any branch, fork or upstream: the same test
# matrix and build, no upload and no Release. Only a tag push on MolCrafts
# uploads.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  guard:
    name: release / guard
    if: github.event_name == 'workflow_dispatch' || github.repository_owner == 'MolCrafts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The tag is the package version, on master
        if: github.event_name == 'push'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src/molpy/version.py | head -n1)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::tag $GITHUB_REF_NAME is not v$version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || { echo "::error::tag is not on master"; exit 1; }

  test:
    name: release / test (${{ matrix.os }}, ${{ matrix.python }})
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    env:
      PYTHONWARNDEFAULTENCODING: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/check_molrs_on_pypi.py
      - run: uv run --no-sources --python ${{ matrix.python }} --extra dev python -m pytest tests/ -n auto

  build:
    name: release / build
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.14"
      - run: uv build && uvx twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  pypi:
    name: release / pypi
    needs: [test, build]
    if: github.event_name == 'push' && github.repository_owner == 'MolCrafts'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/molcrafts-molpy
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
          print-hash: true

  github:
    name: release / github
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
