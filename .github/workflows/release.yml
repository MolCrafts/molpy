name: Release

# Tag push on MolCrafts/molpy → pure-Python wheel to PyPI (trusted publishing).
# Requires molcrafts-molrs on the same major.minor already on PyPI (see release notes).
#
# Before publish: run the same 3 OS × 3.12 / 3.13 / 3.14 unit matrix as CI
# (do not skip a minor of the supported range).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    if: github.repository == 'MolCrafts/molpy'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v9.0.0
      - name: No uv source overrides
        # A [tool.uv.sources] entry (e.g. a path to a sibling molrs checkout)
        # makes the test job resolve something other than what the wheel will
        # declare, and turns off check_molrs_pin_on_pypi.py. Never release with one.
        shell: bash
        run: |
          python - <<'PY'
          import sys, tomllib
          sources = tomllib.load(open("pyproject.toml", "rb")).get("tool", {}).get("uv", {}).get("sources", {})
          if sources:
              sys.exit(f"::error::pyproject.toml still has [tool.uv.sources] {sorted(sources)}; remove it before tagging.")
          PY
      - name: Unit tests
        run: uv run --extra dev python -m pytest tests/ -n auto

  release:
    needs: test
    if: github.repository == 'MolCrafts/molpy'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/molcrafts-molpy
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v9.0.0

      - name: Tag must be on master
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag is not on master; merge release commit first."
            exit 1
          fi

      - name: Version from tag / package
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION="${VERSION#v}"
          else
            VERSION=$(python -c "import pathlib,re; t=pathlib.Path('src/molpy/version.py').read_text(); print(re.search(r'version = \"([^\"]+)\"', t).group(1))")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing molcrafts-molpy==$VERSION"

      - name: Verify package version matches tag
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(python -c "import pathlib,re; t=pathlib.Path('src/molpy/version.py').read_text(); print(re.search(r'version = \"([^\"]+)\"', t).group(1))")
          if [ "${{ steps.ver.outputs.version }}" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag ${{ steps.ver.outputs.version }} != package $PACKAGE_VERSION"
            exit 1
          fi

      - name: Build sdist + wheel
        run: |
          set -euo pipefail
          uv pip install --system build twine
          python -m build
          twine check dist/*

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          print-hash: true
