name: Full

# Manual multi-platform smoke. CI already covers master on every push —
# do not auto-run here (avoids a second 3×3 matrix on the same commit).
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Fetch test data
        shell: bash
        run: |
          dir=tests/tests-data
          if [ -e "$dir/README.md" ]; then exit 0; fi
          mkdir -p "$dir"
          curl -fsSL https://github.com/molcrafts/tests-data/archive/refs/heads/master.tar.gz \
            | tar -xz -C "$dir" --strip-components=1 --exclude='*/con' --exclude='*/con/*'
      - run: uv run --extra dev tox -e py
