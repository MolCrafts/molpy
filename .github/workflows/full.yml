name: Full

# Manual multi-platform smoke. CI already covers master on every push —
# do not auto-run here (avoids a second 3×3 matrix on the same commit).
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv run --locked --extra dev python -m pytest tests/ -n auto
        env:
          PYTHONWARNDEFAULTENCODING: "1"
