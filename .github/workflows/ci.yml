name: CI

# Default gate: same as prek — tox -e lint + tox -e py.
# external (network/binaries) is excluded inside tox env py.
on:
  push:
    branches: [master, dev, dev-*]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v9.0.0
      - name: uv run --extra dev tox -e lint
        run: uv run --extra dev tox -e lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v9.0.0
      - name: uv run --extra dev tox -e py
        run: uv run --extra dev tox -e py
