name: CI

# lint once + unit matrix: 3 OS × Python 3.12 / 3.13 / 3.14
on:
  push:
    branches: [master, dev, dev-*]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv run --no-project --with 'tox>=4.23' --with ruff==0.16.1 --with ty==0.0.65 tox -e lint

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Fetch test data
        shell: bash
        run: |
          dir=tests/tests-data
          if [ -e "$dir/README.md" ]; then exit 0; fi
          mkdir -p "$dir"
          curl -fsSL https://github.com/molcrafts/tests-data/archive/refs/heads/master.tar.gz \
            | tar -xz -C "$dir" --strip-components=1 --exclude='*/con' --exclude='*/con/*'
      # tox's pip install does not honor [tool.uv.sources]; uv does, so the
      # unpublished molrs 0.14 git pin actually resolves here.
      - run: uv run --extra dev python -m pytest tests/ -n auto
