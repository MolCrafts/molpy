name: CI

# lint once + unit matrix: 3 OS × Python 3.12 / 3.13 / 3.14
on:
  push:
    branches: [master, dev, dev-*]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv run --no-project --with 'tox>=4.23' --with ruff==0.16.1 --with ty==0.0.65 tox -e lint

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      # molcrafts-molrs 0.15 is on MolCrafts/molrs master and is not a release.
      # pyproject.toml path-sources ../molrs/molrs-python, so that sibling is
      # checked out beside this repo. Both live under the workspace root.
      - uses: actions/checkout@v7
        with:
          repository: MolCrafts/molrs
          ref: master
          path: molrs
      - uses: actions/checkout@v7
        with:
          path: molpy
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: molrs-${{ matrix.os }}
          workspaces: molrs -> molrs/target
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Unit tests
        working-directory: molpy
        run: uv run --extra dev python -m pytest tests/ -n auto

  # Publishes this run's tests and coverage to the MolCrafts CI index, which
  # the engineering dashboard reads. Separate from the gate matrix on purpose:
  # the matrix decides whether molpy is releasable, and its nine cells would
  # otherwise collide — a snapshot id is keyed by record, profile and commit,
  # so three ubuntu cells would all claim `tests-linux-x86_64-<sha>`. One
  # designated run measures, so one record is published.
  snapshot:
    name: Publish tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: MolCrafts/molrs
          ref: master
          path: molrs
      - uses: actions/checkout@v7
        with:
          path: molpy
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: molrs-ubuntu-latest
          workspaces: molrs -> molrs/target
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0

      # Runs even when the gate matrix went red: a run whose tests failed is
      # exactly the run whose test record is worth keeping. The `|| true` keeps
      # the measurement from deciding this job's verdict — the matrix already did.
      - name: Measure this run
        if: ${{ !cancelled() }}
        working-directory: molpy
        run: |
          uv run --extra dev --with pytest-cov python -m pytest tests/ \
            --junitxml=.ci-out/junit.xml \
            --cov=molpy --cov-branch --cov-report=json:.ci-out/coverage.json || true

      # `--track` waits on the credential as well as the branch: without
      # MOLCRAFTS_CI_SSH_KEY there is nothing to push with, so the snapshots are
      # built and uploaded as an artifact but never published, and CI stays
      # green. Fork pull requests, which get no secrets, stay on that path.
      - name: Build snapshots
        if: ${{ !cancelled() && hashFiles('molpy/.ci-out/junit.xml') != '' }}
        working-directory: molpy
        run: |
          uvx --from git+https://github.com/MolCrafts/molcrafts-ci@master molci snapshot \
            --out .ci-out/snapshots \
            --junit .ci-out/junit.xml \
            --coverage .ci-out/coverage.json \
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master' && secrets.MOLCRAFTS_CI_SSH_KEY != '') && '--track' || '' }}

      - name: Publish to molcrafts-ci
        if: ${{ !cancelled() && hashFiles('molpy/.ci-out/snapshots/*.json') != '' }}
        uses: MolCrafts/molcrafts-ci/actions/submit@master
        with:
          snapshot-path: molpy/.ci-out/snapshots/*.json
          project: molpy
          # A deploy key on molcrafts-ci: one repository, git only.
          ssh-key: ${{ secrets.MOLCRAFTS_CI_SSH_KEY }}
