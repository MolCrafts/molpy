[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "molcrafts-molpy"
dynamic = ["version"]
description = "Modern Python framework for molecular simulation and analysis"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Roy Kid", email = "lijichen365@gmail.com" }]
maintainers = [{ name = "Roy Kid", email = "lijichen365@gmail.com" }]
keywords = [
    "molecular-simulation",
    "computational-chemistry",
    "molecular-dynamics",
    "force-fields",
    "scientific-computing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Typing :: Typed",
]
# Runtime: numpy (scientific baseline) + MolCrafts ecosystem only; the native
# core is this wheel's own molpy._core. No lark / zarr / RDKit / etc. as hard deps.
dependencies = [
    "numpy>=2.0",
    "molcrafts-mollog>=1.3.1,<2",
    "molcrafts-molcfg>=1.5.1,<2",
]

[project.optional-dependencies]
# Gate tools. scripts/check.sh python builds one non-editable wheel and installs
# it into this locked environment; `maturin develop` builds it in place.
dev = [
    "maturin>=1.0,<2.0",
    # The `types` gate: mypy.stubtest holds molpy/_core.pyi to the compiled
    # extension, and mypy --strict holds the stub to itself.
    "mypy>=1.13",
    "pytest>=6.0.0",
    "pytest-xdist>=3.0",
    "pytest-cov",
    "ruff==0.17.2",
    "ty==0.0.91",
]
doc = [
    "zensical>=0.0.53",
    # 0.2.9: equal chart margins + plain VL fences (no annotation passthrough).
    # 0.2.8+ required for ``$file`` data refs in molplot fences.
    "molcrafts-zensical-theme>=0.2.9",
    "mkdocstrings[python]>=0.24.0",
]
all = ["molcrafts-molpy[dev,doc]"]

# Formats molpy owns, published for any molcrafts viewer to read. Declaring
# them here rather than importing a host keeps the arrow one-way: molpy says
# what it can parse, and a platform picks it up at install time.
[project.entry-points."molcrafts.metric_readers"]
lammps_log = "molpy.io.lammps:LammpsLogMetricReader"
mrec = "molpy.io.mrec:MrecMetricReader"
mlp_jsonl = "molpy.io.mlp_jsonl:MlpJsonlMetricReader"

[project.urls]
Homepage = "https://github.com/MolCrafts/molpy/tree/dev/molpy"
Documentation = "https://docs.molcrafts.org/molpy/"
Repository = "https://github.com/MolCrafts/molpy.git"
Issues = "https://github.com/MolCrafts/molpy/issues"

# A mixed Rust/Python project: Cargo.toml + src/ (pyo3) build molpy._core.
# The import package is python/molpy. The version is Cargo.toml's.
[tool.maturin]
module-name = "molpy._core"
python-source = "python"
features = ["pyo3/extension-module"]
exclude = [
  "python/molpy/*.so",
  "python/molpy/*.dylib",
  "python/molpy/*.dll",
  "python/molpy/*.dSYM",
  "python/molpy/*.dSYM/**",
]

# uv caches a molpy it built from a checkout by these keys; with the commit as
# a key, a checkout that moves is rebuilt. Uncommitted Rust edits still need
# `--reinstall-package molcrafts-molpy`.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { git = { commit = true } }]

[tool.ruff]
# Matches requires-python: the lint gate must reject syntax the floor
# (3.12) cannot parse — PEP 758 `except A, B:` slipped in exactly this way.
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# The default-style gate (E4/E7/E9/F), selected explicitly so a ruff release
# that widens its defaults does not widen this gate mid-release.
# PLW1514 (a preview rule; explicit-preview-rules keeps every other preview
# rule off): text-mode file I/O names its encoding. Unnamed, Python decodes
# with the locale -- cp1252 on Windows -- so a read that passes every Linux
# hook fails only on CI's Windows leg.
# TID252: imports within molpy are absolute (docs/developer/coding-style.md).
select = ["E4", "E7", "E9", "F", "RUF100", "PLW1514", "TID252"]
preview = true
explicit-preview-rules = true
# E402: readers/writers import lazily inside functions by design (layering);
# E741: single-letter names in the maths-heavy kernels stay.
ignore = ["E402", "E741"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# The native stub mirrors the Rust names (`l`, the angular momentum number).
"python/molpy/_core.pyi" = ["E743"]
# The docs-series generator is a script package run with ``python -m``, not molpy.
"scripts/**" = ["TID252"]

[tool.ty.environment]
python-version = "3.14"
root = ["python"]

[tool.ty.rules]
# Every rule is an error (the `python` gate's `ty check` fails on any), except
# one style rule: `@override` on overriding methods.
all = "error"
missing-override-decorator = "ignore"

[tool.ty.terminal]
output-format = "full"

[tool.pytest.ini_options]
testpaths = ["tests"]
# No __init__.py under tests/: same basenames (four test_lammps.py) resolve by path.
# Tests import the installed molpy (a wheel, or `maturin develop`'s in-place
# build). The package source is python/molpy. Run `pytest`, not
# `python -m pytest`.
addopts = "--import-mode=importlib"
# The binding suite imports its helpers (`capture`, the persistence child
# process) by module name.
pythonpath = ["tests/test_bindings"]
# "error" covers EncodingWarning too: PYTHONWARNDEFAULTENCODING=1 (CI, the
# hooks and release.yml set it) makes every text-mode open without encoding= warn. Python
# would decode with the locale, cp1252 on Windows, so such a read passes on
# Linux and fails only on Windows; ruff's PLW1514 sees only typed receivers.
filterwarnings = [
    "error",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

# The `types` gate (scripts/check.sh types): the stub python/molpy/_core.pyi
# is the native module's type contract, checked strictly from the source tree
# (`mypy_path`) against the installed extension (stubtest). molpy's
# pure-Python modules are followed for their names only.
[tool.mypy]
strict = true
mypy_path = "python"

[[tool.mypy.overrides]]
module = ["molpy", "molpy.*"]
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["molpy._core"]
follow_imports = "normal"
