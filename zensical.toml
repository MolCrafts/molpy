# Theme injects MathJax config + document$ re-typeset; only the library is listed.
# MolVis / MolPlot WC bundles load from CDN (fences live in molcrafts-zensical-theme).
extra_javascript = [
  { path = "https://cdn.jsdelivr.net/npm/@molcrafts/molvis-stage@latest/dist/viewer.js", type = "module" },
  { path = "https://cdn.jsdelivr.net/npm/@molcrafts/molplot@latest/dist/elements.js", type = "module" },
  "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js",
]

extra_css = ["assets/stylesheets/extra.css"]

[project.theme]
name = "molcrafts"
language = "en"
favicon = "assets/favicon.ico"
logo = "assets/molpy.png"

[project.extra]
generator = false

[project.extra.molcrafts]
product = "molpy"
accent = "#0284c7"                       # primary (主) — molpy signature colour
accent_soft = "rgba(2, 132, 199, 0.14)"  # secondary (副) — soft fill behind it

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/MolCrafts/molpy"

# Declaring markdown_extensions replaces Zensical defaults — keep the standard
# set, then add MolVis / MolPlot fences from the shared theme.
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx]
betterem = {}
caret = {}
details = {}
inlinehilite = {}
keys = {}
magiclink = {}
mark = {}
smartsymbols = {}
tilde = {}
arithmatex = { generic = true }
emoji = { emoji_generator = "zensical.extensions.emoji.to_svg", emoji_index = "zensical.extensions.emoji.twemoji" }
highlight = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true }
tabbed = { alternate_style = true, combine_header_slug = true }
tasklist = { custom_checkbox = true }

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid" },
  { name = "molvis", class = "molvis", format = "molcrafts_zensical_theme.formatters.molvis_fence" },
  { name = "molvis-gallery", class = "molvis-gallery", format = "molcrafts_zensical_theme.formatters.molvis_gallery_fence" },
  { name = "molplot", class = "molplot", format = "molcrafts_zensical_theme.formatters.molplot_fence", validator = "molcrafts_zensical_theme.formatters.molplot_validator" },
]

[project.plugins.search]

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
# Load molrs when resolving ``molpy.Frame → molrs.frame.Frame`` re-exports.
load_external_modules = true

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = false
show_root_heading = true
show_root_full_path = false
separate_signature = true
heading_level = 3
merge_init_into_class = true
filters = ["!^_"]
# Pre-load molrs so alias targets for Frame/Block resolve during collection.
preload_modules = ["molrs"]
